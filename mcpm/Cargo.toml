[package]
name = "mcpm"
version = "0.1.0-dev.26w42d"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
indicatif = "0.18"
terminal-colorsaurus = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
kako-mods-lib = { path = "../kako-mods-lib" }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
shlex = "1.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "registry"] }
unicode-width = "0.2"
tempfile = "3"
textwrap = { version = "0.16", features = ["terminal_size"] }

[dev-dependencies]
serde_json = "1"
