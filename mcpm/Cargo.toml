[package]
name = "mcpm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
indicatif = "0.18"
kako-mods-lib = { path = "../kako-mods-lib" }
owo-colors = "4"
thiserror = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "registry"] }
unicode-width = "0.2"
textwrap = { version = "0.16", features = ["terminal_size"] }
