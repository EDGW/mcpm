[package]
name = "mcpm-backend"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
lazy_static = "1.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
blake3 = "1"
imohash = "0.1.2"
murmur3 = "0.5"
rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "6"
md-5 = "0.10"
shlex = "1.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0.21"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["rt"] }
url = { version = "2", features = ["serde"] }
toml = "1.1.8"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }
