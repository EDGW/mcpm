name: Build and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    env:
      MCPM_OFFICIAL_RELEASE: ${{ github.ref_type == 'tag' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            asset: mcpm-linux-x86_64-glibc
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
            asset: mcpm-linux-arm64-glibc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
            asset: mcpm-linux-x86_64-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
            asset: mcpm-linux-arm64-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: mcpm-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: mcpm-macos-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: mcpm-windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Build Linux binary
        if: runner.os == 'Linux'
        working-directory: crates/mcpm
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: cargo zigbuild --release --bins --locked --target "$ZIG_TARGET"

      - name: Test Windows environment names
        if: runner.os == 'Windows'
        run: cargo test --manifest-path crates/mcpm-backend/Cargo.toml --locked --lib env_name

      - name: Build macOS or Windows binary
        if: runner.os != 'Linux'
        shell: bash
        working-directory: crates/mcpm
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --bins --locked --target "$TARGET"

      - name: Package and verify suite
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          args=(--binary-dir "target/$TARGET/release" --target "$TARGET" --asset "$ASSET")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python scripts/package.py "${args[@]}"

      - name: Test Unix installer lifecycle
        if: runner.os != 'Windows'
        run: python3 scripts/tests/test_install.py

      - name: Test Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tests/install.Tests.ps1 -BinaryDir "target/${{ matrix.target }}/release"

      - name: Upload suite and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error

  release:
    name: Publish binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mcpm-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mcpm-*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
