# Optional. Configuration format version; omitted means 1. Only version 1 is supported.
version = 1

[java]                                # Required table. It may be empty.
executable = "java"                   # Optional string. Omit to find java through PATH.
                                      # A bare name uses PATH. A relative executable path is resolved from the server root.

[jvm.heap]                            # Optional table. Size values use JVM binary units, such as 512M or 8G.
initial = "512M"                      # Optional size. Emits -Xms.
maximum = "8G"                        # Optional size. Emits -Xmx.
young = "512M"                        # Optional size. Emits -Xmn; requires a compatible collector.
maximumRAM = "16G"                    # Optional size. Emits -XX:MaxRAM; this does not cap total process memory.
initialPercentage = 10.0              # Optional number. Emits InitialRAMPercentage; Java interprets the value.
minimumPercentage = 50.0              # Optional number. MinRAMPercentage; controls maximum heap sizing on small-memory systems.
maximumPercentage = 70.0              # Optional number. Emits MaxRAMPercentage; Java interprets the value.

[authlib-injector]                    # Optional table. Enabling it requires apiUrl.
apiUrl = "https://example.com/api/yggdrasil/" # Authentication API URL.
jar = ""                              # Omit or leave empty for mcpm-managed .mcpm/authlib-injector/authlib-injector.jar.
                                      # A nonempty path uses your JAR without hash verification or automatic replacement.
                                      # Relative JAR paths resolve from the server root, regardless of Java working directory.
noLogFile = true                      # Console logging only; false or omission emits no property.
mojangNamespace = "default"           # default, enabled, disabled; default delegates to the agent.
mojangProxy = "socks://127.0.0.1:1080" # Proxy for the Mojang namespace feature only.
legacySkinPolyfill = "default"        # default, enabled, disabled.
debug = []                            # Options: verbose, authlib, dumpClass, printUntransformed; joined with commas.
ignoredPackages = []                  # Additional Java package prefixes; joined with commas.
disableHttpd = true                   # Disables built-in HTTP; affects Mojang namespace and legacy skin API support.
httpdPort = 0                         # Integer, 0..65535; 0 selects a random port.
noShowServerName = true               # Hides authentication server name on the Minecraft main screen.
mojangAntiFeatures = "default"        # default, enabled, disabled.
profileKey = "default"                # default, enabled, disabled; requires authentication server support.
usernameCheck = "default"             # default, enabled, disabled; enabled can reject non-English usernames.

[server]                              # Optional table. Arguments are passed to the target server for interpretation.
nogui = true                          # Optional boolean. true adds nogui; false adds nothing.
port = 25565                          # Optional integer, 0..65535. Emits --port and overrides server-port for this launch.
world = "world"                       # Optional string. Emits --world and overrides level-name for world directory selection.
                                      # These fields do not modify server.properties. There is no generic bindAddress field.

# Conditional auto-restart rules ([[restart_on]]).
# Omit all [[restart_on]] blocks to disable auto-restart.
# Rules are evaluated top-to-bottom on each Java exit; the first matching rule decides.
# Common fields:
#   name   : Optional unique string identifier (defaults to "#1", "#2", ...).
#   type   : "simple" (default), "backoff", or "custom".
#   action : "restart" (default) or "stop" (short-circuits later rules).
# Durations use integer segments with units ms, s, m, h, d (e.g. "500ms", "5s", "10m", "1h30m"; max 365d).
# exit_type accepts a single string or a list of:
#   "crash", "watchdog", "other_crash", "exit", "killed_by_user", "killed_by_mcpm", "any".
# During a restart delay, @stop, @kill, or Ctrl+C cancels the pending restart.

[[restart_on]]                        # Default enabled rule: recover from ServerWatchdog hangs.
name = "watchdog"                     # Optional unique rule name.
type = "simple"                       # Optional; "simple" is the default when omitted.
action = "restart"                    # Optional; "restart" (default) or "stop".
exit_type = "watchdog"                # Matches ServerWatchdog crashes only. Accepts a string or list of matchers.
max_runs = 3                          # Optional integer >= 1. Maximum restarts triggered by this rule within window.
window = "30m"                        # Optional duration > 0 (requires max_runs). Omit for whole shim lifetime.
delay = "5s"                          # Optional duration (default "5s"). Wait time before respawning Java.

[[restart_on]]                        # Example 2: exponential backoff rule to guard against crash loops.
name = "crash-backoff"                # Optional unique rule name.
type = "backoff"                      # Exponential backoff mode.
action = "restart"                    # Optional; "restart" (default) or "stop".
exit_type = ["crash", "watchdog"]     # Optional; defaults to "crash".
exit_codes = [1, 137]                 # Optional integer list. Omit or leave empty to match any exit code.
initial_delay = "5s"                  # Optional duration (default "5s"). Delay for the first consecutive crash.
max_delay = "5m"                      # Optional duration (default "5m"). Upper cap for backoff delay (>= initial_delay).
multiplier = 2.0                      # Optional finite number >= 1.0 (default 2.0).
reset_after = "10m"                   # Optional duration > 0 (default "10m"). Uptime threshold that resets the streak.
max_consecutive = 5                   # Optional integer >= 1. Stop matching after this many consecutive restarts.

# CEL variables available in type = "custom" conditions (all namespaces are always non-null):
#   exit  : exit.type ("exit"|"crash"|"killed_by_mcpm"|"killed_by_user"), exit.code (int),
#           exit.signal (int, 0 if none), exit.stop_requested (bool)
#   crash : crash.detected (bool), crash.parsed (bool),
#           crash.type ("watchdog"|"others"|"unknown"|"none"),
#           crash.desc (string), crash.path (string), crash.error (string)
#   run   : run.uptime (duration), run.uptime_secs (int), run.attempt (int, 1-based),
#           run.total_restarts (int), run.consecutive_crashes (int), run.rcon_ever_connected (bool)
#   now   : Host local timestamp (e.g. now.getHours())
# CEL helper functions:
#   executed(rules: list<string>, window: string) -> int
#     Prior restarts triggered by rule names in `rules` ([] = any rule) within `window` ("" = shim lifetime).
#   exits(types: list<string>, window: string) -> int
#     Exits matching exit_type matchers in `types` ([] = any) within `window` ("" = shim lifetime), including current exit.

[[restart_on]]                        # Example 3: custom CEL boolean expression rule.
name = "watchdog-cel"                 # Optional unique rule name (can be referenced in executed([...], ...)).
type = "custom"                       # Custom CEL mode.
action = "restart"                    # Optional; "restart" (default) or "stop".
condition = "exit.type == 'crash' && crash.type == 'watchdog' && executed(['watchdog-cel'], '10m') < 3"
delay = "5s"                          # Optional duration (default "5s").

[application]                         # Optional table.
extraArguments = []                   # Optional argv array. Appended after fixed application arguments and generated server options.

[jvm]                                 # Optional table. Omitted settings emit no JVM arguments.
threadStack = "1M"                    # Optional size. Emits -Xss; this is thread stack memory, not heap memory.
extraArguments = [                    # Optional argv array. Appended after launch.toml JVM arguments and generated JVM settings.
    "-Dfile.encoding=UTF-8",          # Each string is one argument. No shell expansion is performed.
]


# Advanced JVM options:
# Put memory and GC tuning without dedicated fields in jvm.memory.extraArguments.

[jvm.metaspace]                       # Optional table.
initial = "128M"                      # Optional size. MetaspaceSize: initial metadata GC threshold, not preallocated memory.
maximum = "512M"                      # Optional size. MaxMetaspaceSize: maximum metaspace size.
compressedClassSpace = "256M"         # Optional size. CompressedClassSpaceSize; requires compatible JVM capabilities.

[jvm.direct]                          # Optional table.
maximum = "1G"                        # Optional size. MaxDirectMemorySize: direct buffer memory limit.

[jvm.codeCache]                       # Optional table.
initial = "32M"                       # Optional size. InitialCodeCacheSize: initial code cache size.
maximum = "256M"                      # Optional size. ReservedCodeCacheSize: reserved code cache limit.

[jvm.gc]                              # Optional table. Omit collector to keep the JVM's default selection.
collector = "g1"                      # Optional: serial, parallel, g1, zgc, shenandoah, or epsilon.
maxPauseMillis = 200                  # Optional integer. MaxGCPauseMillis is a target, not a pause-time guarantee.
parallelThreads = 4                   # Optional integer. ParallelGCThreads; requires collector support.
concurrentThreads = 2                 # Optional integer. ConcGCThreads; requires collector support.
disableExplicit = true                # Optional boolean. Emits +/-DisableExplicitGC.
explicitConcurrent = true             # Optional boolean. Emits +/-ExplicitGCInvokesConcurrent.
stringDeduplication = true            # Optional boolean. Emits +/-UseStringDeduplication; requires collector support.

[jvm.gc.g1]                           # Optional table. Requires G1; this table does not select the collector.
regionSize = "8M"                     # Optional size. G1HeapRegionSize; interpreted by the selected JVM.
reservePercentage = 10                # Optional integer percentage. G1ReservePercent; JVM-specific limits apply.
initiatingOccupancyPercentage = 45    # Optional integer percentage. InitiatingHeapOccupancyPercent; JVM-specific limits apply.

[jvm.memory]                          # Optional table. All remaining recognized memory and GC settings belong here.
preTouch = true                       # Optional boolean. Emits +/-AlwaysPreTouch.
largePages = true                     # Optional boolean. Emits +/-UseLargePages; operating system support is required.
extraArguments = [                    # Optional argv array. Preserves remaining memory/GC options in their original order.
    "-XX:NewRatio=2",                 # Example: old-to-young generation ratio; collector-specific behavior applies.
    "-XX:SurvivorRatio=8",            # Example: Eden-to-survivor ratio; collector-specific behavior applies.
]                                     # Must not duplicate settings already managed by structured fields.
